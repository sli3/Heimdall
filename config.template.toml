[wazuh]
host = "${WAZUH_HOST}"
port = ${WAZUH_PORT}
user = "${WAZUH_API_USER}"
password = "${WAZUH_API_PASSWORD}"

# Wazuh Indexer (OpenSearch) — usually same host, port 9200
indexer_host = "${WAZUH_INDEXER_HOST}"
indexer_port = ${WAZUH_INDEXER_PORT}
indexer_user = "${WAZUH_INDEXER_USER}"
indexer_password = "${WAZUH_INDEXER_PASSWORD}"

[llm]
base_url = "${LLM_BASE_URL}"
api_key = "${LLM_API_KEY}"
model = "${LLM_MODEL}"
temperature = ${LLM_TEMPERATURE}
max_tokens = ${LLM_MAX_TOKENS}

[reports]
output_dir = "${RAVENSIGHT_REPORTS_DIR}"

[baseline]
path = "${RAVENSIGHT_DATA_DIR}/baseline_state.json"

[trending]
# Rolling window in days for trend analysis
window_days = ${TRENDING_WINDOW_DAYS}
# Write standalone trending_YYYY-MM-DD.md report
output_standalone = ${TRENDING_OUTPUT_STANDALONE}

[mitre]
# Path to local MITRE ATT&CK dataset (JSON format)
path = "${RAVENSIGHT_DATA_DIR}/mitre_attack.json"
# MITRE ATT&CK dataset source URL
sync_source = "https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json"

[embeddings]
endpoint = "${EMBEDDINGS_ENDPOINT}"
model = "${EMBEDDINGS_MODEL}"
chroma_db_path = "${RAVENSIGHT_DATA_DIR}/chromadb"
top_k = ${EMBEDDINGS_TOP_K}

[asd]
path = "${RAVENSIGHT_DATA_DIR}/asd_framework.json"

[e8]
overrides_path = "${RAVENSIGHT_DATA_DIR}/e8_keyword_overrides.json"

[platform]
# Path to platform false positive hint table
# Edit this file directly to add new hints — no code change required
hints_path = "${RAVENSIGHT_DATA_DIR}/platform_hints.json"
